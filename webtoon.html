<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&family=Pinyon+Script&display=swap">

</head>
<body>
<div class="sheet">
<main>
<section class="sec pad wt-head">
  <p class="eyebrow">Webtoon</p>
  <h2 id="title"></h2>
  <p class="lead" id="lead"></p>
</section>
<div class="wt" id="wt"></div>
<section class="sec pad tint wt-end">
  <p class="eyebrow">To be continued</p>
  <p class="lead" id="end"></p>
  <a class="more" href="index.html">청첩장으로 돌아가기</a>
</section>
</main>
</div>
<script type="module">
import './js/common.js?v=c83e6e22';
import { webtoon, t } from './js/config.js?v=c83e6e22';
import { onTheme } from './js/hidden.js?v=c83e6e22';
const $ = (s) => document.getElementById(s);
const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
// 테마가 바뀌면 같은 그림에 다른 시점의 글을 다시 붙임
onTheme((watch) => {
  $('title').replaceChildren(mk('small', '', webtoon.ep), watch ? webtoon.titleWatch : webtoon.title);
  $('lead').textContent = watch ? webtoon.leadWatch : webtoon.lead;
  $('end').textContent = watch ? webtoon.endWatch : webtoon.end;
  $('wt').replaceChildren(...webtoon.cuts.map((c, i) => {
    const cut = mk('article', 'cut');
    if (c.src) { const im = mk('img'); if (i > 1) im.loading = 'lazy'; im.src = c.src; im.alt = c.memo; cut.appendChild(im); }
    else { // 그림이 아직 없는 컷은 콘티로 표시
      const ph = mk('div', 'ph'); ph.append(mk('b', '', 'CUT ' + String(i + 1).padStart(2, '0')), mk('span', '', c.memo), mk('small', '', t('그리는 중')));
      cut.appendChild(ph);
    }
    // n: 해설(속마음), y: 여름, u: 자기(독자)
    (watch ? c.watch : c.lines).forEach(([who, text]) => cut.appendChild(mk('p', who, text)));
    return cut;
  }));
});
</script>
</body>
</html>
