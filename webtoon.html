<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>웹툰</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&family=Pinyon+Script&display=swap">
<link rel="stylesheet" href="css/style.css?v=5">
<script src="js/theme.js"></script>
</head>
<body>
<div class="sheet">
<main>
<section class="sec pad wt-head">
  <p class="eyebrow">Webtoon</p>
  <h2 id="title"></h2>
  <p class="lead" id="lead"></p>
</section>
<div class="wt" id="wt"></div>
<section class="sec pad tint wt-end">
  <p class="eyebrow">To be continued</p>
  <p class="lead" id="end"></p>
  <a class="more" href="index.html">청첩장으로 돌아가기</a>
</section>
</main>
</div>
<script type="module">
import './js/common.js';
import { webtoon } from './js/config.js';
import { onTheme } from './js/hidden.js';
const $ = (s) => document.getElementById(s);
const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
$('title').replaceChildren(mk('small', '', webtoon.ep), webtoon.title);
$('lead').textContent = webtoon.lead;
webtoon.cuts.forEach((c, i) => {
  const cut = mk('article', 'cut');
  if (c.src) { const im = mk('img'); im.src = c.src; im.alt = c.memo; if (i > 1) im.loading = 'lazy'; cut.appendChild(im); }
  else { // 그림이 아직 없는 컷은 콘티로 표시
    const ph = mk('div', 'ph'); ph.append(mk('b', '', 'CUT ' + String(i + 1).padStart(2, '0')), mk('span', '', c.memo), mk('small', '', '그리는 중'));
    cut.appendChild(ph);
  }
  // n: 해설, y: 여름, u: 자기(독자)
  c.lines.forEach(([who, text]) => cut.appendChild(mk('p', who, text)));
  $('wt').appendChild(cut);
});
onTheme((watch) => { $('end').textContent = watch ? webtoon.endWatch : webtoon.end; });
</script>
</body>
</html>
