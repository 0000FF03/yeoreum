<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>신부 소개</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&family=Pinyon+Script&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="sheet">
<main>
<section class="cover pad">
  <p class="std">The Bride</p>
  <p class="sub">신부 소개</p>
  <div class="arch sm"><img id="pic" alt="한여름 일러스트"></div>
  <p class="names"><span id="name"></span></p>
  <p class="date" id="tagline"></p>
  <div class="tags" id="tags"></div>
</section>
<section class="sec pad">
  <p class="eyebrow">Profile</p>
  <h2>신부 정보</h2>
  <dl class="info" id="facts"></dl>
</section>
<section class="sec pad tint">
  <p class="eyebrow">Personality</p>
  <h2>성격</h2>
  <div class="traits" id="traits"></div>
</section>
<section class="sec pad">
  <p class="eyebrow">Dictionary</p>
  <h2>여름의 번역기</h2>
  <p class="lead">자기가 무슨 말을 하든, 여름에게는 이렇게 들려요.</p>
  <div class="trans" id="trans"></div>
</section>
<section class="sec pad tint">
  <p class="eyebrow">Just in case</p>
  <h2>“걱정돼서요!” 체크리스트</h2>
  <ul class="check" id="watch"></ul>
  <p class="note" id="wnote"></p>
</section>
<section class="sec pad">
  <p class="eyebrow">Habits</p>
  <h2>신부의 습관</h2>
  <ul class="habits" id="habits"></ul>
</section>
<section class="sec pad tint">
  <p class="eyebrow">Our Story</p>
  <h2>우리의 이야기</h2>
  <p class="lead" id="lead"></p>
  <ol class="story" id="tl"></ol>
</section>
</main>
</div>
<script type="module">
import { setAvatar } from './js/common.js';
import { site, character as c, chat, world, room, gallery, invite } from './js/config.js';
const $ = (s) => document.getElementById(s);
const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
$('pic').src = c.image;
$('name').textContent = c.name;
$('tagline').textContent = c.tagline;
c.tags.forEach((t) => $('tags').appendChild(mk('span', '', '#' + t)));
c.facts.forEach(([k, v]) => { const d = mk('div'); d.append(mk('dt', '', k), mk('dd', '', v)); $('facts').appendChild(d); });
c.traits.forEach(([t, d]) => { const k = mk('div'); k.append(mk('b', '', t), mk('p', '', d)); $('traits').appendChild(k); });
world.translator.forEach(([a, b]) => { const r = mk('div'); r.append(mk('s', '', a), mk('i'), mk('b', '', b)); $('trans').appendChild(r); });
world.watch.forEach((w) => $('watch').appendChild(mk('li', '', w)));
$('wnote').textContent = world.watchNote;
c.habits.forEach((h) => $('habits').appendChild(mk('li', '', h)));
$('lead').textContent = world.lead;
world.timeline.forEach(([a, b]) => { const li = mk('li'); li.append(mk('b', '', a), mk('span', '', b)); $('tl').appendChild(li); });
</script>
</body>
</html>
