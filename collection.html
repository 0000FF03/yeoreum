<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>수집품</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&family=Pinyon+Script&display=swap">
<link rel="stylesheet" href="css/style.css">
<script src="js/theme.js"></script>
</head>
<body>
<div class="sheet">
<main>
<section class="sec pad">
  <p class="eyebrow">Collection</p>
  <h2>수집품 전시실</h2>
  <p class="lead" data-watch="버린 줄 알았죠? 전부 여기 있어요. 하나도 빠짐없이.">자기가 쓰고 간 물건들을 신부가 소중히 보관하고 있어요. 드래그하면 돌려볼 수 있어요.</p>
  <div class="stage3d case"><canvas id="canvas"></canvas><p class="hint">드래그해서 돌려보세요</p></div>
  <div class="list" id="list"></div>
  <div class="placard" aria-live="polite"><small id="pno"></small><b id="pname"></b><dl class="info" id="pinfo"></dl><p class="quote" id="pline"></p></div>
</section>
</main>
</div>
<script type="module">
import './js/common.js';
import { collection } from './js/config.js';
import { mountCase } from './js/collection.js';
const $ = (s) => document.getElementById(s);
const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const view = mountCase($('canvas'), collection);
const btns = {};
function show(it) {
  view.show(it.id);
  $('pno').textContent = 'No. ' + it.no;
  $('pname').textContent = it.name;
  $('pinfo').replaceChildren(...it.info.map(([k, v]) => { const d = mk('div'); d.append(mk('dt', '', k), mk('dd', '', v)); return d; }));
  $('pline').textContent = it.line;
  Object.entries(btns).forEach(([k, b]) => { b.classList.toggle('on', k === it.id); b.setAttribute('aria-pressed', String(k === it.id)); });
}
collection.forEach((it) => { const b = mk('button', '', `${it.no} ${it.name}`); b.type = 'button'; b.onclick = () => show(it); btns[it.id] = b; $('list').appendChild(b); });
show(collection[0]);
</script>
</body>
</html>
