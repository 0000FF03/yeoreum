<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>연락하기</title>
<meta name="description" content="신부에게 말을 걸어 보세요. 무슨 말을 해도 긍정적으로 해석합니다.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="한여름">
<meta property="og:title" content="연락하기 | 한여름">
<meta property="og:description" content="신부에게 말을 걸어 보세요. 무슨 말을 해도 긍정적으로 해석합니다.">
<meta property="og:image" content="https://0000ff03.github.io/yeoreum/assets/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#fffdf8">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&family=Pinyon+Script&display=swap">
<link rel="stylesheet" href="css/style.css?v=c83e6e22">
<script src="js/theme.js?v=c83e6e22"></script>
</head>
<body>
<div class="sheet">
<main>
<section class="sec pad">
  <p class="eyebrow">Contact</p>
  <h2>신부에게 연락하기</h2>
  <p class="lead">아래 선택지 중 하나를 골라 먼저 말을 걸어보세요. 어떤 말을 해도 신부는 긍정적으로 해석해요. 정해진 대사로만 이어지는 연출용 대화예요.</p>
  <div class="chat">
    <div class="bar"><div class="ava" id="ava"></div><div><b id="who"></b><small data-watch="활동 중 · 바로 뒤">활동 중 · 너 근처</small></div><button class="btn reset" id="reset" type="button">처음부터</button></div>
    <div class="log" id="log" aria-live="polite"></div>
    <div class="choices" id="choices"></div>
  </div>
</section>
</main>
</div>
<script type="module">
import { setAvatar } from './js/common.js?v=c83e6e22';
import { character as c, chat, hidden, faceWatch, fmt, t } from './js/config.js?v=c83e6e22';
import { mark, onTheme, isWatch } from './js/hidden.js?v=c83e6e22';
const $ = (s) => document.getElementById(s);
const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
setAvatar($('ava'));
$('who').textContent = t('신부') + ' ' + c.name;
const log = $('log'), choicesEl = $('choices');
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
let token = 0, lastFrom = '';
const scroll = () => { log.scrollTop = log.scrollHeight; };
function say(text, face) {
  if (text.startsWith('*')) { log.appendChild(mk('div', 'act', text.replace(/\*/g, '').trim())); lastFrom = 'act'; scroll(); return; }
  const row = mk('div', 'row c');
  const a = mk('div', 'ava'); setAvatar(a, face); setAvatar($('ava'), face); // 대사마다 표정이 바뀜
  row.append(a, mk('div', 'msg', text));
  log.appendChild(row); lastFrom = 'c'; scroll();
}
function me(text) { log.querySelector('.empty')?.remove(); const row = mk('div', 'row u'); row.appendChild(mk('div', 'msg', text)); log.appendChild(row); lastFrom = 'u'; scroll(); }
async function play(id) {
  const mine = ++token;
  const node = chat.nodes[id];
  choicesEl.replaceChildren();
  if (!log.children.length) log.appendChild(mk('p', 'empty', t('아직 대화가 없어요. 아래에서 먼저 말을 걸어보세요.')));
  let n = 0;
  for (const line of node.say) {
    const dots = mk('div', 'typing', t('입력 중…'));
    log.appendChild(dots); scroll();
    await sleep(500 + line.length * fmt.typing);
    dots.remove();
    if (mine !== token) return;
    say(line, line.startsWith('*') ? '' : node.faces?.[n++]);
  }
  if (id !== chat.start) mark('chat', id, Object.keys(chat.nodes).length - 1); // 모든 장면을 보면 히든 테마
  node.choices.forEach((ch) => { const b = mk('button', 'btn', ch.t); b.type = 'button'; b.onclick = () => { me(ch.t); play(ch.next); }; choicesEl.appendChild(b); });
}
// 히든 테마: 안내와 선택지가 사라지고, 여름이 혼자 메시지를 계속 보냄
const lead = document.querySelector('.lead');
const stamp = (text) => {
  const d = new Date(), h = d.getHours();
  return text
    .replace('{time}', fmt.time(h, d.getMinutes()))
    .replace('{date}', fmt.date(d.getMonth() + 1, d.getDate()))
    .replace('{day}', fmt.day(d.getDay()));
};
async function flood() {
  const mine = ++token;
  log.replaceChildren(); choicesEl.replaceChildren(); lastFrom = '';
  if (document.querySelector('.glitch')) await sleep(3600); // 전환 화면이 걷힌 뒤에 시작
  // 끝없이 무작위로 보냄. 같은 말이 연달아 나오지 않게 하고, 오래된 메시지는 지워서 가볍게 유지
  let prev = '';
  for (;;) {
    await sleep(1400);
    if (mine !== token) return;
    const pool = hidden.flood.filter((l) => l !== prev);
    prev = pool[Math.floor(Math.random() * pool.length)];
    say(stamp(prev), faceWatch[Math.floor(Math.random() * faceWatch.length)]);
    while (log.children.length > 60) log.firstChild.remove();
  }
}
function start() {
  const watch = isWatch();
  lead.hidden = choicesEl.hidden = watch;
  if (watch) { flood(); return; }
  token++; log.replaceChildren(); lastFrom = ''; setAvatar($('ava')); play(chat.start);
}
$('reset').onclick = start;
onTheme(start);
</script>
</body>
</html>
